<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.11 - Tablas HTML</title>
    <!-- Se utiliza una hoja de estilos CSS externa (styles.css) para separar el contenido y la estructura (HTML) del diseño visual (presentación), evitando así el uso de atributos obsoletos como border, align o bgcolor que ya no forman parte de los estándares modernos. -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- table: Se usa para definir una tabla de datos tabular, estructurando la información en filas y columnas. -->
    <table>
        <!-- caption: Sirve para añadir un título o leyenda descriptiva a toda la tabla, facilitando su comprensión y accesibilidad. -->
        <caption>Horario de 1º DAW</caption>
        <!-- tr (Table Row): Define una fila horizontal de celdas dentro de una tabla. -->
        <tr>
            <!-- th (Table Header): Define una celda de encabezado de tabla, la cual por defecto aparece en negrita y centrada para destacar sobre los datos normales. -->
            <th>Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
        </tr>
    </table>
</body>
</html>
